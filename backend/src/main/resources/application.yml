spring:
  application:
    name: devcollab-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devcollab}
    username: ${DB_USER:devcollab}
    password: ${DB_PASSWORD:devcollab}

  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  # Real email is sent through any SMTP relay (Resend / Brevo / SendGrid /
  # Mailgun / SES / Outlook …). You can set these values below or via env vars.
  # When unset (or password missing), codes are logged to the console (dev) instead.
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:illia.tkachenko.0804@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:wrfb ylgm uvfw hboh}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          github:
            # Real GitHub login activates once these are set. "disabled" lets
            # the app boot without credentials (email/password still works).
            client-id: ${GITHUB_CLIENT_ID:Ov23ligMUFCmgiKI4DBF}
            client-secret: ${GITHUB_CLIENT_SECRET:6640f9d267b985230225deb8699930e5e50a241b}
            scope: read:user,user:email

server:
  error:
    include-stacktrace: always
    include-message: always
  port: ${SERVER_PORT:8080}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${APP_MAIL_FROM:DevCollab <${SPRING_MAIL_USERNAME:your.email@gmail.com}>}
  jwt:
    # Override in real environments. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-0123456789}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL:900}        # 15 minutes
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:1209600}  # 14 days
  verification:
    ttl-seconds: ${VERIFICATION_TTL:600}      # 10 minutes
    max-attempts: ${VERIFICATION_MAX_ATTEMPTS:5}
  cookie:
    secure: ${COOKIE_SECURE:false}            # true in production (HTTPS)
    same-site: ${COOKIE_SAME_SITE:Lax}        # None for cross-site prod
  cors:
    # Patterns (port wildcards allowed). Covers localhost + this host's LAN IP so
    # other devices on the network can reach the API. Override via CORS_ALLOWED_ORIGINS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://192.168.1.97:*}
  storage:
    type: ${STORAGE_TYPE:local} # local or s3
    dir: ${STORAGE_DIR:uploads}
    s3:
      endpoint: ${S3_ENDPOINT:https://<account_id>.r2.cloudflarestorage.com}
      region: ${S3_REGION:auto}
      access-key: ${S3_ACCESS_KEY:my-access-key}
      secret-key: ${S3_SECRET_KEY:my-secret-key}
      bucket-name: ${S3_BUCKET:devcollab}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
