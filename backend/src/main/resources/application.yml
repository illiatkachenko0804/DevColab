spring:
  application:
    name: devcollab-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devcollab}
    username: ${DB_USER:devcollab}
    password: ${DB_PASSWORD:devcollab}

  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # GitHub OAuth is wired in Phase 1. The registration block is intentionally
  # omitted here so the app boots without credentials during Phase 0.

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Override in real environments. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-0123456789}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL:900}        # 15 minutes
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:1209600}  # 14 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
